<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TBOP Secure Document Vault</title>
<link rel="stylesheet" href="./src/modules/documents/vault.css">
</head>
<body style="margin:0;background:#0a0d10">
<div id="vaultApp"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script type="module">
import { VaultController } from "./src/modules/documents/vault-controller.js";

const cfg=window.TBOP_CONFIG||{};
const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

const {data:{session}}=await client.auth.getSession();
if(!session){
  location.href="./login.html";
}else{
  const {data:profile,error}=await client.from("profiles").select("*").eq("id",session.user.id).single();
  if(error){
    document.getElementById("vaultApp").textContent="Unable to load your profile.";
  }else{
    const controller=new VaultController({
      root:document.getElementById("vaultApp"),
      supabaseClient:client,
      profile
    });
    controller.start();
  }
}
</script>
</body>
</html>
