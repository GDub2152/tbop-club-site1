<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080a0c">
  <title>Secure Document Vault | The Blowtorch of Parma</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="src/modules/documents/vault.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body style="margin:0;background:#0a0d10">
  <div style="padding:10px 18px;background:#11161b;border-bottom:1px solid #30363d">
    <a href="portal.html" style="color:#ff6a00;text-decoration:none;font-weight:800">← Back to Officer Portal</a>
  </div>
  <div id="vaultApp"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script type="module">
    import { VaultController } from "./src/modules/documents/vault-controller.js";

    const cfg = window.TBOP_CONFIG || {};
    const configured =
      cfg.SUPABASE_URL &&
      cfg.SUPABASE_ANON_KEY &&
      !cfg.SUPABASE_URL.includes("YOUR-PROJECT") &&
      !cfg.SUPABASE_ANON_KEY.includes("YOUR_PUBLIC");

    if (!configured) {
      document.getElementById("vaultApp").innerHTML =
        '<div style="padding:30px;color:white">Supabase is not configured.</div>';
    } else {
      const client = window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_ANON_KEY,
        {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
      );

      const { data: { session } } = await client.auth.getSession();

      if (!session) {
        location.href = "login.html";
      } else {
        const { data: profile, error } = await client
          .from("profiles")
          .select("*")
          .eq("id", session.user.id)
          .single();

        if (error) {
          document.getElementById("vaultApp").innerHTML =
            '<div style="padding:30px;color:white">Unable to load your member profile.</div>';
        } else {
          const controller = new VaultController({
            root: document.getElementById("vaultApp"),
            supabaseClient: client,
            profile
          });
          await controller.start();
        }
      }
    }
  </script>
</body>
</html>
